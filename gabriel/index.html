<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Comprobantes · Newsan</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#E8232E">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Comprobantes">
  <link rel="apple-touch-icon" href="../icon-192.png">
  <link rel="icon" href="../icon-192.png">

  <style>
    html, body { margin:0; padding:0; height:100%; background:#fff; overflow:hidden; }
    /* El ALTO ya NO lo decide el CSS: lo mide y lo pone el JavaScript (más abajo),
       porque en el iPhone instalado las unidades vh/dvh se calculan mal. */
    #app { position:fixed; top:0; left:0; width:100vw; border:0; display:block; }
    #splash { position:fixed; inset:0; z-index:2; background:#E8232E;
      display:flex; align-items:center; justify-content:center; transition:opacity .4s ease; }
    #splash.off { opacity:0; pointer-events:none; }
    .sp { width:38px; height:38px; border-radius:50%;
      border:4px solid rgba(255,255,255,.35); border-top-color:#fff; animation:spin 1s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <div id="splash"><div class="sp"></div></div>
  <iframe id="app" src="https://script.google.com/a/macros/newpga.com.ar/s/AKfycbxRV0aOR0XFK8QknydxVRl4BRgCQQeMGNvwbVlDlTCxSnI94tosGMYb879IK5JtjdjVJQ/exec?u=gabi" allow="camera; clipboard-write" referrerpolicy="no-referrer-when-downgrade"></iframe>
  <script>
    var app = document.getElementById('app');

    // Mide la pantalla REAL y le da ese alto exacto al iframe.
    function ajustarAlto(){ app.style.height = window.innerHeight + 'px'; }
    ajustarAlto();
    // Re-mide cuando el iPhone termina de acomodar la barra (ahí es cuando "se ampliaba").
    window.addEventListener('resize', ajustarAlto);
    window.addEventListener('orientationchange', function(){ setTimeout(ajustarAlto, 300); });
    window.addEventListener('load', function(){ setTimeout(ajustarAlto, 300); setTimeout(ajustarAlto, 800); });

    var quitar = function(){ document.getElementById('splash').classList.add('off'); };
    app.addEventListener('load', quitar);
    setTimeout(quitar, 6000);

    // Sin service worker + limpieza de cualquier copia vieja
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) { regs.forEach(function (r) { r.unregister(); }); }).catch(function(){});
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function (keys) { keys.forEach(function (k) { caches.delete(k); }); }).catch(function(){});
    }
  </script>
</body>
</html>
